<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Study Std.Hub — Admin</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="admin-body"><header><div class="wrap nav"><a class="brand" href="/">Free Study <span>Std.Hub</span></a><nav><a href="/">View site</a></nav></div></header>
<main class="wrap admin-main">
<div id="loginBox" class="panel small"><h1>Admin Login</h1><form id="loginForm"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button>Login</button><p id="loginMsg" class="msg"></p></form></div>
<div id="dashboard" hidden>
<div class="admin-head"><div><p class="eyebrow">CONTROL PANEL</p><h1>Admin Dashboard</h1><p>Add and manage subjects and questions. Changes appear on the public site immediately.</p></div><button class="secondary" onclick="logout()">Logout</button></div>
<div class="two">
<section class="panel"><h2>Subjects</h2><form id="subjectForm"><input id="subjectName" placeholder="Subject name" required><textarea id="subjectDesc" placeholder="Short description"></textarea><button>Add Subject</button></form><div id="adminSubjects"></div></section>
<section class="panel"><h2>Add Question</h2><form id="questionForm"><select id="qSubject" required></select><textarea id="question" placeholder="Question" required></textarea><textarea id="answer" placeholder="Answer" required></textarea><button>Add Question</button></form><p id="qMsg" class="msg"></p></section>
</div>
<section class="panel"><div class="section-title"><h2>Questions</h2><input id="adminSearch" oninput="renderAdminQuestions()" placeholder="Filter questions"></div><div id="adminQuestions"></div></section>
</div></main><script src="/js/admin.js"></script></body></html>
